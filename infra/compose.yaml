services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: emotional_robot
      POSTGRES_USER: robot
      POSTGRES_PASSWORD: ${ROBOT_POSTGRES_PASSWORD:?Set ROBOT_POSTGRES_PASSWORD first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - robot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robot -d emotional_robot"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  robot_postgres:
